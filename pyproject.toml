[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=3.0",
    "cmake>=3.25",
    "ninja>=1.11",
]
build-backend = "scikit_build_core.build"

[project]
name = "falcocv"
version = "1.0.0rc1"
description = "Modular industrial machine vision environment with a DAG workflow engine and web HMI"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "FalcoCV contributors" }]
keywords = ["machine-vision", "computer-vision", "industrial", "workflow", "opencv", "pyqt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.26",
    # pylibdmtx imports distutils.version (removed from Python 3.12+);
    # setuptools provides the shim. Required for DataMatrix decoding.
    "setuptools>=83.0.0",
    "Pillow>=10.0.0",
    "opencv-python>=5.0.0",
    "PyQt6>=6.5.0",
    "PyQt6-QScintilla>=2.14.0",
    "pyzbar>=0.1.9",
    "pylibdmtx>=0.1.10",
    "zxing-cpp>=3.0.0,<3.1",
    "python-Levenshtein>=0.26.0",
    "python-barcode>=0.16.0",
    "fastapi>=0.146.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "python-multipart>=0.0.31",
    "psutil>=5.9.0",
    "PyOpenGL>=3.1.7",
    "tifffile>=2023.0.0",
    "imagecodecs>=2023.0.0",
    "onnxruntime>=1.15.0",
    "harvesters>=1.4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "httpx2>=0.1",
    "build>=1.2",
]

[project.scripts]
falcocv = "falcocv.cli:main"
falcocv-server = "falcocv.web.__main__:main"
falcocv-hmi = "falcocv.hmi_designer:main"
falcocv-download-models = "falcocv.core.models:download_models_cli"

[project.urls]
Homepage = "https://github.com/jaesc/falcocv"
Repository = "https://github.com/jaesc/falcocv"
Issues = "https://github.com/jaesc/falcocv/issues"

[tool.scikit-build]
minimum-version = "0.10"
cmake.source-dir = "cpp/kernel"
cmake.build-type = "Release"
wheel.packages = ["src/falcocv"]
sdist.include = [
    "src/falcocv/**",
    "cpp/kernel/**",
    "README.md",
    "LICENSE",
    "CREDITS.md",
    "pyproject.toml",
]
sdist.exclude = [
    ".git/**",
    ".github/**",
    ".venv",
    "**/.venv/**",
    ".pytest_cache",
    "**/.pytest_cache/**",
    "**/__pycache__/**",
    "**/*.pyc",
    ".opencode/**",
    "**/.opencode/**",
    "opencode.json",
    "models/**",
    "test_pictures/**",
    "cpp/bin/**",
    "build/**",
    "dist/**",
    "benchmarks/.legacy/**",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
timeout = 120
markers = [
    "ui: needs a QApplication (offscreen)",
    "integration: full workflow / job round-trip",
    "web: FastAPI / HMI server tests",
    "accuracy: synthetic ground-truth / matcher accuracy",
    "models: needs the ONNX model files",
    "slow: not part of the default PR run",
]

[tool.coverage.run]
branch = true
source = ["falcocv"]
# UI configuration widgets are exercised by the offscreen smoke tests, but
# their file-dialog/hardware branches are not a meaningful coverage gate.
omit = ["*/tools/*/config.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = ["*-musllinux_*"]
test-requires = ["numpy"]
test-command = "python -c \"import falcocv; from falcocv._falco_kernel import generate_pointcloud; print(falcocv.__version__)\""

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"

