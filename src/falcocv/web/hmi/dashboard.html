<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FalcoCV Server</title>
<link rel="icon" type="image/png" href="/hmi/favicon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1e1e1e; color: #d4d4d4; font: 14px Consolas, monospace; padding: 24px; }
  h1 { font-size: 20px; margin-bottom: 16px; color: #4ec9b0; font-weight: normal; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; color: #888; font-weight: normal; border-bottom: 1px solid #333; padding: 8px 6px; font-size: 12px; text-transform: uppercase; }
  td { padding: 10px 6px; border-bottom: 1px solid #2d2d2d; }
  tr:hover td { background: #252525; }
  td.alive { color: #4ec9b0; }
  td.stopped { color: #555; }
  .btn { cursor: pointer; border: none; padding: 4px 12px; border-radius: 3px; font: 13px Consolas, monospace; background: #333; color: #d4d4d4; }
  .btn:hover { filter: brightness(1.2); }
  .btn-open { background: #2d5a3a; color: #a0ffa0; }
  .btn-stop { background: #5a2d2d; color: #ff9090; }
  .btn-reload { background: #4a3a2d; color: #d4a860; }
  .empty { color: #666; text-align: center; padding: 40px; }
  #status { font-size: 12px; color: #666; margin-top: 12px; }
</style>
</head>
<body>
<h1 style="display:flex; align-items:center; gap:12px;">
  <img src="/hmi/logo_lockup_dark.png" alt="FalcoCV" style="height:32px;">
  <span style="color:#888; font-size:14px; font-weight:normal;">Server</span>
</h1>
<table>
  <thead>
    <tr>
      <th>Project</th><th>PID</th><th>Memory</th><th>Uptime</th><th>Grid</th><th>Slots</th><th></th>
    </tr>
  </thead>
  <tbody id="projects"></tbody>
</table>
<div id="empty" class="empty">No projects loaded</div>
<div id="status">Connecting...</div>
<script src="hmi/dashboard.js"></script>
</body>
</html>
