name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wheels:
    name: Wheels and sdist
    uses: ./.github/workflows/wheels.yml

  standalone:
    name: Standalone bundles
    uses: ./.github/workflows/standalone.yml

  publish_pypi:
    name: Publish to PyPI
    needs: [wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Check version matches tag
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/falcocv/version.py)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "version.py is $VERSION but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # rekor.sigstore.dev returns 502s often enough to break releases
          attestations: false

  github_release:
    name: Publish GitHub release
    needs: [standalone, wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4

      - name: Check version matches tag
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/falcocv/version.py)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "version.py is $VERSION but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: standalone-*
          path: release-assets
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: release-assets
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: release-assets

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Sign Linux assets
        if: env.GPG_PRIVATE_KEY != '' && env.GPG_PASSPHRASE != ''
        working-directory: release-assets
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')
          ARGS=(--batch --yes --armor --detach-sign --local-user "$KEY_ID")
          if [ -n "${GPG_PASSPHRASE:-}" ]; then
            ARGS+=(--pinentry-mode loopback --passphrase "$GPG_PASSPHRASE")
          fi
          gpg "${ARGS[@]}" SHA256SUMS.txt
          for image in FalcoCV-*-linux-*.AppImage; do
            gpg "${ARGS[@]}" "$image"
          done
          gpg --armor --export "$KEY_ID" > FALCOCV_GPG_KEY.asc

      - name: Create or update release
        run: |
          TAG="$GITHUB_REF_NAME"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "FalcoCV $TAG" --generate-notes
          fi
          gh release upload "$TAG" release-assets/* --clobber
