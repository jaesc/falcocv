name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  full:
    name: full / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libzbar0 libdmtx0b libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install (builds the minimal kernel)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test suite (unit + integration + UI + web)
        run: python -m pytest -q --ignore=tests/test_trainer_equivalence.py --junitxml=junit.xml --cov=falcocv.core --cov=falcocv.tools --cov-fail-under=35 --cov-report=xml

      - name: Upload JUnit / coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            junit.xml
            coverage.xml

  compat:
    name: compat / ${{ matrix.os }} / Python 3.10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libzbar0 libdmtx0b libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Core / integration tests (no UI)
        run: python -m pytest -q -m "not ui and not web and not slow" --ignore=tests/test_trainer_equivalence.py

  package:
    name: package / wheel + sdist
    runs-on: ubuntu-latest
    needs: [full]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build wheel
        run: python -m build --wheel --outdir dist

      - name: Check wheel contents
        run: python scripts/check_wheel.py

      - name: Install into a throwaway venv and self-test
        run: python scripts/wheel_smoke.py

      - uses: actions/upload-artifact@v4
        with:
          name: falcocv-wheel
          path: dist/*.whl
