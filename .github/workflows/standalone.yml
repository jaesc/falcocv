name: Standalone

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    name: Windows bundle and installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev,plc,protocols,standalone]"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }

      - name: Download models
        shell: pwsh
        run: |
          $models = python -c "from falcocv.core.models import ensure_models; print(ensure_models())"
          "MODELS_DIR=$models" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build bundle, ZIP and installer
        shell: pwsh
        run: |
          python scripts/build_standalone.py --zip --installer --models-dir "$env:MODELS_DIR"
          if (-not (Get-ChildItem dist/standalone/FalcoCV-*-windows-x64-setup.exe -ErrorAction SilentlyContinue)) {
            throw "Windows installer was not produced"
          }

      - name: Smoke test
        run: python scripts/smoke_standalone.py

      - uses: actions/upload-artifact@v4
        with:
          name: standalone-windows
          path: |
            dist/standalone/FalcoCV-*.zip
            dist/standalone/FalcoCV-*-windows-x64-setup.exe
          if-no-files-found: error

  linux:
    name: Linux bundle and AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Install
        run: python -m pip install -e ".[dev,plc,protocols,standalone]"

      - name: Install appimagetool
        run: |
          sudo wget -q \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Download models
        run: |
          MODELS_DIR=$(python -c "from falcocv.core.models import ensure_models; print(ensure_models())")
          echo "MODELS_DIR=$MODELS_DIR" >> "$GITHUB_ENV"

      - name: Build bundle, ZIP and AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: python scripts/build_standalone.py --zip --appimage --models-dir "$MODELS_DIR"

      - name: Smoke test
        run: python scripts/smoke_standalone.py

      - uses: actions/upload-artifact@v4
        with:
          name: standalone-linux
          path: |
            dist/standalone/FalcoCV-*.zip
            dist/standalone/FalcoCV-*.AppImage
          if-no-files-found: error
