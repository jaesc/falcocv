name: Standalone

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    name: Windows bundle and installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev,plc,protocols,standalone]"

      - name: Build bundle, ZIP and installer
        run: python scripts/build_standalone.py --zip --installer

      - name: Smoke test
        run: python scripts/smoke_standalone.py

      - uses: actions/upload-artifact@v4
        with:
          name: standalone-windows
          path: |
            dist/standalone/FalcoCV-*.zip
            dist/standalone/FalcoCV-*-windows-x64-setup.exe
          if-no-files-found: error

  linux:
    name: Linux bundle and AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Install
        run: python -m pip install -e ".[dev,plc,protocols,standalone]"

      - name: Install appimagetool
        run: |
          sudo wget -q \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Build bundle, ZIP and AppImage
        run: python scripts/build_standalone.py --zip --appimage

      - name: Smoke test
        run: python scripts/smoke_standalone.py

      - uses: actions/upload-artifact@v4
        with:
          name: standalone-linux
          path: |
            dist/standalone/FalcoCV-*.zip
            dist/standalone/FalcoCV-*.AppImage
          if-no-files-found: error
